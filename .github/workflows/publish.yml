name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Validate source files
        run: node --check src/index.mjs

      - name: Show Trusted Publishing context
        run: |
          echo "repository=${GITHUB_REPOSITORY}"
          echo "workflow_ref=${GITHUB_WORKFLOW_REF}"
          echo "ref=${GITHUB_REF}"
          echo "event=${GITHUB_EVENT_NAME}"

      - name: Publish to npm
        run: npm publish --provenance --access public
